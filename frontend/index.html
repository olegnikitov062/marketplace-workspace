<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b1d20">
    <link rel="icon" type="image/svg+xml" href="/basework-icon.svg">
    <title>BaseWork</title>
    <script>
try {
  const value = localStorage.getItem('basework.theme.v1');
  const theme = value === 'light' || value === 'dark' ? value : value === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : 'dark';
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#1b1d20' : '#f3f4f3';
} catch { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
